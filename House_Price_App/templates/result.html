<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- html2pdf for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="result-body d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm glass-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <i class="fa-solid fa-house-chimney me-2 fs-3"></i>
                <span class="fw-bold fs-4">EstatePredict</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                    <li class="nav-item ms-lg-3">
                        <button id="theme-toggle" class="btn btn-outline-light rounded-circle">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden fade-in-up" id="pdf-content">
                
                {% if error %}
                <!-- Error State -->
                <div class="card-header bg-danger text-white text-center py-4">
                    <i class="fa-solid fa-circle-xmark display-4 mb-2"></i>
                    <h3 class="fw-bold mb-0">Prediction Failed</h3>
                </div>
                <div class="card-body p-5 text-center">
                    <p class="fs-5 text-secondary mb-4">{{ error }}</p>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-semibold btn-hover">
                        <i class="fa-solid fa-arrow-left me-2"></i> Try Again
                    </a>
                </div>
                {% else %}
                <!-- Success State -->
                <div class="card-header bg-success text-white text-center py-5 result-header position-relative">
                    <div class="overlay"></div>
                    <i class="fa-solid fa-house-circle-check display-1 mb-3 position-relative z-1"></i>
                    <h5 class="text-uppercase tracking-wide fw-bold mb-0 position-relative z-1 text-white-50">Predicted House Price</h5>
                </div>
                
                <div class="card-body p-5 text-center bg-white position-relative">
                    
                    <div class="price-display my-4">
                        <h1 class="display-3 fw-bold text-success gradient-text-success mb-0">
                            ${{ "{:,.2f}".format(prediction*10) }}
                        </h1>
                    </div>
                    
                    <hr class="my-4 border-2">

                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-primary rounded-pill px-4 py-3 fw-bold shadow-sm btn-hover flex-grow-1">
                            <i class="fa-solid fa-rotate-left me-2"></i> Predict Again
                        </a>
                        <button id="download-pdf" class="btn btn-primary rounded-pill px-4 py-3 fw-bold shadow btn-hover flex-grow-1">
                            <i class="fa-solid fa-download me-2"></i> Save PDF
                        </button>
                    </div>
                </div>
                {% endif %}
                
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer py-4 bg-dark text-white-50 mt-auto">
        <div class="container text-center">
            <span class="fw-semibold">Made with <i class="fa-solid fa-heart text-danger mx-1"></i> &amp; Flask</span>
            <br>
            <small>&copy; 2026 EstatePredict. All Rights Reserved.</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
